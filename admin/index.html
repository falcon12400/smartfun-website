<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFun 網站管理</title>
<link rel="stylesheet" href="admin.css">
</head><body>
<header class="topbar"><a class="brand" href="../g/index.html"><b>聰明動</b><small>SMART FUN 管理後台</small></a><div class="account"><span id="account-name"></span><button id="sign-out" class="quiet" hidden>登出</button></div></header>

<main>
  <section id="setup" class="notice" hidden>
    <div><b>後台程式已就緒，還差 Firebase 專案設定</b><p>目前可先預覽與測試編輯畫面，不會影響公開網站。圖片上傳需要啟用 Firebase Blaze 方案，設定前不會產生費用。</p></div>
    <a href="../FIREBASE_SETUP.md">查看設定步驟</a>
  </section>

  <section id="login" class="login-card">
    <div class="login-art">🔐</div><p class="eyebrow">SMART FUN ADMIN</p><h1>網站內容管理</h1>
    <p>使用已加入管理員白名單的 Google 帳號登入，即可修改教具名稱、說明、圖片與顯示順序。</p>
    <button id="google-login" class="primary">使用 Google 帳號登入</button>
    <button id="preview-mode" class="quiet">先看後台畫面</button>
    <p id="login-status" class="status"></p>
  </section>

  <section id="workspace" class="workspace" hidden>
    <aside class="sidebar">
      <div class="side-head"><div><p class="eyebrow">教具內容</p><h2>教具列表</h2></div><span id="product-count"></span></div>
      <div id="product-list" class="product-list"></div>
    </aside>

    <form id="editor" class="editor">
      <div class="editor-head"><div><p class="eyebrow">編輯中</p><h1 id="editor-title">選擇教具</h1></div><span id="save-state" class="save-state">尚未修改</span></div>
      <div class="image-field">
        <div class="image-preview"><img id="image-preview" alt="教具主圖預覽"></div>
        <div><label class="upload"><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp">更換主圖</label><p>會自動產生 400、800、1600 像素 WebP，讓手機載入更快。</p><span id="upload-status" class="status"></span></div>
      </div>
      <div class="fields">
        <label>教具名稱<input name="name" required></label>
        <label>分類<input name="cat" list="category-list" required><datalist id="category-list"></datalist></label>
        <label>適合年齡<input name="age"></label>
        <label>零件說明<input name="parts"></label>
        <label class="wide">一句特色<input name="tagline"></label>
        <label class="wide">教具說明<textarea name="desc" rows="5"></textarea></label>
      </div>
      <div class="editor-actions">
        <div><button id="move-up" type="button" class="quiet">往前移</button><button id="move-down" type="button" class="quiet">往後移</button></div>
        <button id="publish" type="submit" class="primary">發布到網站</button>
      </div>
      <p class="preview-note" id="preview-note" hidden>目前是預覽模式：可測試欄位與排序，但不會儲存或發布。</p>
    </form>
  </section>
</main>

<script src="../assets/catalog.js"></script>
<script src="../assets/plays.js"></script>
<script src="../assets/firebase-config.js"></script>
<script type="module" src="admin.js"></script>
</body></html>
