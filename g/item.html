<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教具｜聰明動 SMART FUN</title>
<link rel="stylesheet" href="../assets/base.css">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--coral:#e8663d;--coral2:#d9552e;--orange:#f2874f;--sun:#ffc23d;--cream:#fff1de;--peach:#ffe4d2;--brown:#5a3b2a;--bg:#fff8ee;--pad:clamp(18px,6vw,88px)}
body{font-family:"Noto Sans TC",sans-serif;color:#4a352a;background:var(--bg)}
.hf,h1,h2,h3{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400}
.w{padding-left:var(--pad);padding-right:var(--pad);max-width:1440px;margin:0 auto}
header.top .w{display:flex;justify-content:space-between;align-items:center;height:88px}
.logo b{display:block;font-family:"Huninn";font-size:32px;color:var(--coral);line-height:1}.logo small{font-size:13px;color:#f29a3a;font-weight:900;letter-spacing:3px}
nav.main{display:flex;gap:36px;align-items:center;font-size:17px}nav.main a:hover{color:var(--coral)}nav.main .line{background:var(--coral);color:#fff;border-radius:30px;padding:11px 24px;font-weight:700}
.mline,.menu,.mob{display:none}
.crumb{font-size:14px;color:#b09888;padding-top:4px;padding-bottom:0;gap:8px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center;padding-top:20px;padding-bottom:80px}
.stage{position:relative;height:600px}
.blob{position:absolute;inset:10px 20px 40px 0;background:var(--peach);border-radius:46% 54% 42% 58% / 52% 40% 60% 48%}
.b2{position:absolute;width:150px;height:150px;right:6px;top:20px;background:var(--sun);border-radius:50%}
.b3{position:absolute;width:90px;height:90px;left:20px;bottom:30px;background:#ff9a76;border-radius:50%}
.frame{position:absolute;left:8%;top:70px;width:min(500px,84%);height:460px;border-radius:40px;overflow:hidden;box-shadow:0 30px 50px rgba(200,90,40,.25);transform:rotate(-2.5deg);border:10px solid #fff;background:#fff}
.viewer{width:100%;height:100%;aspect-ratio:auto}
.spin{position:absolute;right:30px;bottom:70px;background:#fff;border-radius:30px;padding:12px 20px;font-weight:700;color:var(--coral2);box-shadow:0 8px 20px rgba(0,0,0,.08);z-index:4;pointer-events:none}
#modes{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
#modes button{background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:700;color:#8a6a55;box-shadow:0 3px 8px rgba(150,90,40,.1)}#modes button.on{background:var(--coral);color:#fff}
.b-pill{display:inline-block;background:var(--sun);color:#5a3d00;font-weight:900;font-size:14px;padding:6px 16px;border-radius:20px}
h1{font-size:72px;color:#3a2a20;margin:14px 0 6px;letter-spacing:2px}
#tagline{font-family:"Huninn";font-size:24px;color:var(--coral);margin-bottom:18px}
#desc{font-size:18px;line-height:1.9;color:#7a6050}
#facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
.f{background:#fff;border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 14px rgba(150,90,40,.08)}
.f i{font-style:normal;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
.f small{display:block;color:#b09888;font-size:12px}.f b{font-size:16px}
.cta{display:flex;gap:14px;margin-top:30px}.cta a,.cta button{padding:16px 30px;border-radius:40px;font-weight:900;font-size:17px}.cta a{background:var(--coral);color:#fff;box-shadow:0 10px 20px rgba(232,102,61,.3)}.cta button{border:2.5px solid var(--brown);color:var(--brown)}
.wave{display:block;width:100%;height:80px}
.plays-sec{background:linear-gradient(180deg,var(--orange),#ec7448);padding-top:10px;padding-bottom:90px}
.ph2{text-align:center;color:#fff}.ph2 h2{font-size:48px}.ph2 h2 span{color:#fff3b0}.ph2 p{opacity:.9;margin-top:4px;font-size:17px}
.pfilters{display:flex;justify-content:center;gap:10px;margin:28px 0 40px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips button{background:rgba(255,255,255,.18);color:#fff;border-radius:30px;padding:10px 22px;font-weight:700}.chips button i{display:none}.chips button.on{background:#fff;color:var(--coral2)}
.sep{color:#fff;opacity:.5}
#f-limit{color:#fff;font-weight:700;font-size:14px;background:rgba(255,255,255,.18);border-radius:30px;padding:9px 18px}#f-limit input{accent-color:var(--sun);margin-right:4px}
.plays{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.play{background:#fff;border-radius:32px;padding:16px 16px 24px;position:relative;transition:transform .2s}.play:hover{transform:translateY(-4px)}
.play .im{border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:var(--cream)}.play .im img{width:100%;height:100%;object-fit:cover}
.play .n{position:absolute;top:28px;left:28px;width:46px;height:46px;border-radius:50%;background:var(--sun);color:#5a3d00;font-family:"Huninn";font-size:22px;display:flex;align-items:center;justify-content:center;border:4px solid #fff}
.play .tm{position:absolute;top:30px;right:30px;background:rgba(255,255,255,.94);color:var(--coral2);font-weight:900;font-size:13px;padding:6px 12px;border-radius:20px}
.play h3{font-size:26px;margin:18px 8px 8px;color:#3a2a20}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 8px}.t{font-size:13px;font-weight:700;padding:4px 12px;border-radius:14px;background:var(--cream);color:#9a5a2a}.t-type{background:#ffe0d6;color:#c0392b}.t-limit{background:#fff1cc;color:#8a5a00}
.play p.in{margin:12px 8px 0;color:#8a7060;line-height:1.75;font-size:15px}
.bt{display:flex;gap:10px;margin:18px 8px 0}.bt button{flex:1;text-align:center;border-radius:30px;padding:11px;font-weight:900;font-size:15px}.bt .see{background:var(--sun);color:#5a3d00}.bt .more{background:#f6efe6}
.detail{margin:16px 8px 0;font-size:14px;color:#5a4a40;background:var(--cream);border-radius:18px;padding:16px}
.detail h4{font-size:14px;color:var(--coral2);margin:12px 0 4px}.detail h4:first-child{margin-top:0}.detail a{color:var(--coral2);font-weight:700}
.plays-sec .empty{color:#fff}
#plays-more{display:none}
.rel-sec{padding-top:80px;padding-bottom:90px;text-align:center}.rel-sec h2{font-size:40px;margin-bottom:32px}.rel-sec h2 span{color:var(--coral)}
#related{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.rel{background:#fff;border-radius:28px;padding:18px;box-shadow:0 6px 18px rgba(150,90,40,.08);transition:transform .2s}.rel:hover{transform:translateY(-4px)}
.rel .ri img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--cream);border-radius:20px;padding:14px}.rel b{display:block;margin-top:12px;font-family:"Huninn";font-size:19px;font-weight:400}.rel small{display:none}
footer{text-align:center;color:#c0ab98;padding:26px;font-size:14px}
.fab{display:none}
@media (max-width:1100px){.hero{grid-template-columns:1fr 1fr;gap:32px}h1{font-size:52px}.plays{grid-template-columns:repeat(2,1fr)}}
/* ---------- 手機版 ---------- */
@media (max-width:760px){
 body{padding-bottom:30px}
 header.top .w{height:62px}.logo b{font-size:24px}.logo small{font-size:10px;letter-spacing:2px}
 nav.main{display:none}.mob{display:block}.mline{display:inline-block;background:var(--coral);color:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px}.menu{display:inline;font-size:22px;margin-left:10px}
 .crumb{display:none}
 .hero{grid-template-columns:1fr;gap:0;padding-top:4px;padding-bottom:30px}
 .stage{height:370px;margin:0 calc(var(--pad) * -1 + 4px)}
 .blob{inset:10px 14px 50px 14px}.b2{width:86px;height:86px;right:18px;top:0}.b3{width:56px;height:56px;left:16px;bottom:56px}
 .frame{left:50%;margin-left:-145px;top:34px;width:290px;height:260px;border-radius:30px;border-width:8px}
 .spin{right:28px;bottom:58px;font-size:13px;padding:8px 14px}
 #modes{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 18px;scrollbar-width:none}#modes button{flex:0 0 auto;font-size:12px}
 .info{padding-top:18px}h1{font-size:44px;margin:8px 0 2px}#tagline{font-size:18px;margin-bottom:10px}#desc{font-size:15px;line-height:1.85}
 #facts{gap:10px;margin-top:18px}.f{border-radius:18px;padding:12px;gap:10px}.f i{width:38px;height:38px;border-radius:13px;font-size:19px}.f small{font-size:10px}.f b{font-size:13px}
 .cta{display:none}
 .wave{height:46px}
 .plays-sec{padding-top:4px;padding-bottom:36px}
 .ph2 h2{font-size:34px}.ph2 p{font-size:13px}
 .pfilters{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:8px;margin:18px calc(var(--pad) * -1) 22px;padding:0 var(--pad);scrollbar-width:none}
 .chips{flex-wrap:nowrap;gap:8px}.chips button{white-space:nowrap;padding:8px 16px;font-size:13px}.sep{display:none}#f-limit{white-space:nowrap;font-size:13px;padding:8px 14px}
 .plays{grid-template-columns:1fr;gap:16px}
 .play{border-radius:28px;padding:12px 12px 18px}.play .im{aspect-ratio:auto;height:190px;border-radius:20px}
 .play .n{top:22px;left:22px;width:38px;height:38px;font-size:18px;border-width:3px}.play .tm{top:24px;right:24px;font-size:12px;padding:5px 10px}
 .play h3{font-size:22px;margin:14px 6px 6px}.tags{margin:0 6px;gap:5px}.t{font-size:11px;padding:3px 10px}.play p.in{margin:10px 6px 0;font-size:14px;line-height:1.7}
 .bt{margin:14px 6px 0;gap:8px}.bt button{font-size:14px;padding:10px}
 #plays-more:not([hidden]){display:block;width:100%;margin-top:6px;text-align:center;background:#fff;color:var(--coral2);font-weight:900;border-radius:24px;padding:13px}
 .rel-sec{padding-top:30px;padding-bottom:20px;padding-right:0}.rel-sec h2{font-size:26px;margin-bottom:16px;padding-right:var(--pad)}
 #related{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-right:var(--pad)}
 .rel{flex:0 0 140px;border-radius:22px;padding:12px}.rel .ri img{height:100px;aspect-ratio:auto;border-radius:16px;padding:8px}.rel b{font-size:15px;margin-top:8px}
 .fab{display:block;position:fixed;right:16px;bottom:22px;background:#06c755;color:#fff;font-weight:900;border-radius:30px;padding:14px 20px;box-shadow:0 10px 20px rgba(6,199,85,.35);font-size:15px;z-index:30}
}

/* 人數少的玩法：設定與收合區 */
.gear-wrap{position:relative}
#f-gear{background:rgba(255,255,255,.18);color:#fff;border-radius:30px;padding:10px 18px;font-weight:700}
#gear-pop{position:absolute;right:0;top:calc(100% + 10px);z-index:20;width:250px;background:#fff;color:#4a352a;border-radius:18px;padding:16px 18px;box-shadow:0 12px 30px rgba(74,53,42,.25);text-align:left}
#gear-pop b{display:block;margin-bottom:8px}#gear-pop label{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:700}
#gear-pop small{display:block;margin-top:6px;color:#8a7768;font-size:12px;line-height:1.5}
#small-sec{margin-top:34px;text-align:center}
.sm-toggle{background:rgba(255,255,255,.22);color:#fff;border:2px dashed rgba(255,255,255,.7);border-radius:30px;padding:12px 26px;font-weight:900;font-size:15px}
.sm-note{max-width:640px;margin:18px auto 22px;background:#fff8ee;color:#4a352a;border-radius:16px;padding:14px 18px;font-size:14px;line-height:1.7;text-align:left}
.sm-set{background:none;color:#e8663d;font-weight:900;text-decoration:underline;padding:0}
.sm-plays{text-align:left}
@media (max-width:760px){ .gear-wrap{flex:none} #f-gear{white-space:nowrap;padding:8px 14px;font-size:13px} #gear-pop{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto} .sm-toggle{width:100%;font-size:14px} }
</style></head><body>
<div class="proto">試作版：玩法內容與 3D 尺寸為示意</div>
<header class="top"><div class="w"><a class="logo" href="index.html"><b>聰明動</b><small>SMART FUN</small></a>
<nav class="main"><a href="index.html#catalog">教具系列</a><a href="#plays-sec">玩法方案</a><a href="#">教師資源</a><a class="line" href="index.html#contact">LINE 詢問</a></nav><div class="mob"><a class="mline" href="index.html#contact">LINE</a><span class="menu">☰</span></div></div></header>
<nav class="w crumb" id="crumb"></nav>
<section class="w hero">
 <div class="stage"><div class="blob"></div><div class="b2"></div><div class="b3"></div><div class="frame"><div class="viewer" id="viewer"></div></div><div class="spin">↻ 轉轉看 3D</div><div id="modes"></div></div>
 <div class="info"><span class="b-pill" id="star">⭐ 招牌教具</span><h1 id="name"></h1><div id="tagline"></div><p id="desc"></p><div id="facts"></div>
  <div class="cta"><a href="index.html#contact">💬 LINE 詢問這項教具</a><button class="js-print">🖨 列印玩法</button></div></div>
</section>
<svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none"><path d="M0,50 C240,0 480,90 720,45 C960,0 1200,70 1440,30 L1440,80 L0,80 Z" fill="#f2874f"/></svg>
<section class="plays-sec" id="plays-sec"><div class="w">
 <div class="ph2"><h2>怎麼<span>玩</span>？</h2><p>挑一個今天想玩的，孩子馬上就能上手</p></div>
 <div class="pfilters" id="filters"><div class="chips" id="f-type"></div><span class="sep">｜</span><div class="chips" id="f-age"></div><div id="f-limit"></div><div class="gear-wrap"><button id="f-gear" aria-label="顯示設定">⚙ 顯示設定</button><div id="gear-pop" hidden><b>適合 4 人以下的玩法</b><label><input type="radio" name="small" value="fold"> 收合在最下面</label><label><input type="radio" name="small" value="show"> 一起顯示</label><small>大班上課時建議收合，列表比較清爽。</small></div></div></div>
 <div class="plays" id="plays"></div><button id="plays-more"></button>
 <div id="small-sec" hidden></div>
</div></section>
<section class="w rel-sec"><h2>一起玩的<span>好朋友</span></h2><div id="related"></div></section>
<footer>© 聰明動 SMART FUN</footer>
<a class="fab" href="index.html#contact">💬 LINE 詢問</a>

<script src="../assets/catalog.js"></script>
<script src="../assets/plays.js"></script>
<script type="module">
import { initItem } from "../assets/item.js";
const p = PRODUCTS.find(x => x.id === new URLSearchParams(location.search).get("id")) || PRODUCTS[0];
if (!p.star) document.getElementById("star").hidden = true;
if (!p.model) document.querySelector(".spin").hidden = true;
initItem({
  viewerBg: "#fff4e6", zoom: .85, limitLabel: "不限場地",
  facts: ({ p, plays }) => `<div class="f"><i style="background:#ffe4d2">🎯</i><div><small>訓練能力</small><b>${p.skills.slice(0, 3).map(s => s.replace(/^動態|穩定$|控制$/g, "")).join("・")}</b></div></div>
    <div class="f"><i style="background:#fff1cc">🧒</i><div><small>適合年齡</small><b>${p.age}</b></div></div>
    <div class="f"><i style="background:#ffe0d6">🧩</i><div><small>零件</small><b>${p.parts ? p.parts.replace("六角柱×4、半圓柱×1", "柱子×5").replace(/×/g, " ") : "—"}</b></div></div>
    <div class="f"><i style="background:#ffeacc">🎲</i><div><small>玩法</small><b>${plays.length ? plays.length + " 種玩法" : "整理中"}</b></div></div>`,
  modeLabel: v => v.replace("雙拱＋橫桿", "彩虹梯").replace("單片拱橋", "山洞").replace("倒放搖椅", "搖搖船").replace("S 型平放", "S 小路").replace("平放＋立柱", "立柱").replace("全部零件", "零件"),
  card: c => `<article class="play"><div class="im"><img src="${c.img}" style="object-position:${c.pos}" alt="" loading="lazy"></div><span class="n">${c.n}</span>
    <h3>${c.esc(c.pl.name)}</h3><div class="tags">${c.tags}</div><p class="in">${c.esc(c.pl.intro)}</p>
    <div class="bt">${c.see ? `<button class="see" data-mode="${c.mode}">看擺法</button>` : ""}<button class="more">完整玩法</button></div>${c.detail}</article>`,
});
</script>
</body></html>
