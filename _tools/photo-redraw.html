<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<!-- 看照片重畫：參考 LINE 教案相簿「115-1-18擊破板」第 22 張（一人拿擊破板、一人側踢）。截圖 1200x840 -->
<style>html,body{margin:0;background:#fff}svg{display:block}</style></head><body>
<svg id="c" width="1200" height="840" viewBox="0 0 1200 840" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
import { kidSVG } from "./kid-art.js";
const W = 1200, H = 840, GY = 700; // 地面線
const OUT = "#4a3328";
// 把人物 SVG 放進場景：x,y=腳底位置，h=高度
function place(pose, opt, x, y, h) {
  const k = kidSVG(pose, opt), s = h / k.h, inner = k.svg.replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "");
  const ox = x - k.w * k.ax * s, oy = y - k.h * (1 - k.ay) * s;
  const pt = p => p && [ox + (opt.flip ? k.w - p[0] : p[0]) * s, oy + p[1] * s];
  return { svg: `<g transform="translate(${ox},${oy}) scale(${s})">${inner}</g>`, hand: pt(k.hand), foot: pt(k.foot) };
}
// 背景：牆、綠色看板、橘色防撞墊、地墊
const seam = [];
for (let k = -6; k <= 14; k++) { const x0 = k * 110, x1 = W / 2 + (x0 - W / 2) * 2.4; seam.push(`<path d="M${x0},${GY - 170} L${x1},${H + 40}" stroke="#d9d6d0" stroke-width="2"/>`); }
for (let k = 0; k < 5; k++) { const y = GY - 170 + Math.pow(k / 4, 1.6) * 330; seam.push(`<path d="M0,${y} L${W},${y}" stroke="#d9d6d0" stroke-width="2"/>`); }
const pad = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="#d9874a" stroke="${OUT}" stroke-width="3"/><rect x="${x + 22}" y="${y + 22}" width="${w - 44}" height="${h - 44}" rx="6" fill="none" stroke="#3b2a20" stroke-width="7"/><path d="M${x + 10},${y + 10} q${w * .4},-6 ${w - 30},4" stroke="#f0b07a" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7"/>`;
let s = `<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4e8"/><stop offset="1" stop-color="#f1e6d3"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e7e3"/><stop offset="1" stop-color="#dcd9d3"/></linearGradient>
  <radialGradient id="light" cx="45%" cy="25%" r="70%"><stop offset="0" stop-color="#fffbe9" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
<rect width="${W}" height="${GY - 170}" fill="url(#wall)"/>
<path d="M560,0 L1200,0 L1200,${GY - 175} L640,${GY - 175} Z" fill="#e6f2e0"/>
<path d="M1040,0 L1200,0 L1200,120 Z" fill="#b9dca8" opacity=".7"/>
<g opacity=".9"><rect x="650" y="70" width="300" height="30" rx="15" fill="#5aa36b"/><rect x="650" y="120" width="380" height="22" rx="11" fill="#8cc49a"/><rect x="650" y="160" width="250" height="22" rx="11" fill="#8cc49a"/></g>
${pad(960, 120, 250, 250)}${pad(960, 375, 250, 220)}
<rect x="0" y="${GY - 170}" width="${W}" height="${H - GY + 170}" fill="url(#floor)"/>
${seam.join("")}
<path d="M0,${GY - 120} L470,${GY - 175} L470,${GY - 150} L0,${GY - 80} Z" fill="#3d6fd1" stroke="${OUT}" stroke-width="3"/>
<path d="M0,${GY - 80} L470,${GY - 150} L470,${GY - 140} L0,${GY - 64} Z" fill="#2c55a8"/>
<rect width="${W}" height="${H}" fill="url(#light)"/>`;
// 背景：等待的小朋友（坐著）
s += place("front", { shirt: "#ba68c8", pants: "#455a64", hair: "#4e342e" }, 90, GY - 110, 150).svg;
s += place("front", { shirt: "#ffca28", pants: "#26a69a", hair: "#212121", style: 1 }, 175, GY - 120, 140).svg;
s += place("front", { shirt: "#4fc3f7", pants: "#ef6c00", hair: "#3e2723", style: 2 }, 1080, GY + 110, 190).svg;
// 主角：左邊拿擊破板（面向右），右邊側踢（面向左）
const holder = place("hold", { shirt: "#fff3d6", pants: "#9e9e9e", hair: "#212121" }, 340, GY + 30, 400);
const kicker = place("kick", { shirt: "#ffffff", pants: "#a3a3a3", hair: "#3e2723", flip: true }, 700, GY + 22, 380);
// 影子
s += `<ellipse cx="350" cy="${GY + 34}" rx="90" ry="20" fill="#8a7a66" opacity=".22" filter="url(#soft)"/><ellipse cx="712" cy="${GY + 26}" rx="80" ry="18" fill="#8a7a66" opacity=".22" filter="url(#soft)"/>`;
s += holder.svg + kicker.svg;
// 擊破板：手上的綠色泡棉板（側面看是一片斜的板子）
const [hx, hy] = holder.hand;
s += `<g transform="rotate(-6 ${hx + 40} ${hy})"><rect x="${hx - 10}" y="${hy - 14}" width="104" height="24" rx="8" fill="#7ed957" stroke="${OUT}" stroke-width="3.5"/><rect x="${hx - 6}" y="${hy - 12}" width="96" height="7" rx="3" fill="#b6f08e"/></g>`;
// 拿板子的手再畫一次蓋在板子上
s += `<circle cx="${hx}" cy="${hy}" r="${6 * 400 / 232}" fill="#ffd7b5" stroke="${OUT}" stroke-width="3"/>`;
// 碰！效果
const [fx, fy] = [hx + 98, hy - 6];
s += `<g transform="translate(${fx},${fy})"><path d="M0,-46 L12,-16 L44,-26 L22,0 L46,22 L14,18 L6,48 L-8,20 L-38,34 L-20,6 L-46,-12 L-14,-14 Z" fill="#ffd54f" stroke="${OUT}" stroke-width="3" stroke-linejoin="round"/>
  <text x="2" y="9" text-anchor="middle" font-family="Huninn,'Microsoft JhengHei',sans-serif" font-weight="900" font-size="24" fill="#e8663d">碰！</text></g>`;
// 整體紙紋與暖光
s += `<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11"/><feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .4 -.16"/></filter><rect width="${W}" height="${H}" filter="url(#paper)"/>`;
document.getElementById("c").innerHTML = s;
document.title = "ready";
</script></body></html>
