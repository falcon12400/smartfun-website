<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聰明動 SMART FUN｜E 專業教學資源</title>
<link rel="stylesheet" href="../assets/base.css">
<style>
:root{--navy:#13294b;--accent:#f5b301;--accent-ink:#13294b;--radius:10px}
body{background:#f3f5f8;color:#1c2a3a}
.wrap{max-width:1296px;margin:0 auto;padding:0 48px}
.bar{background:#0d1f3a;color:#c9d4e5;font-size:13px}.bar .wrap{display:flex;justify-content:space-between;padding-top:8px;padding-bottom:8px}
header{background:#fff;box-shadow:0 1px 0 #e3e7ee;position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;gap:40px;height:72px}
.logo{font-size:22px;font-weight:900;color:var(--navy);white-space:nowrap}.logo b{color:var(--accent)}
nav{display:flex;gap:28px;font-size:15px;font-weight:700;flex:1}nav a:hover{color:#c58f00}
.search{width:260px;border:1px solid #cfd6e0;border-radius:6px;padding:9px 12px;font:inherit;font-size:14px}
.menu{display:none;font-size:26px;margin-left:auto}
.hero{background:var(--navy);color:#fff}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:60px;padding-bottom:60px}
.hero h1{font-size:clamp(30px,3.4vw,46px);line-height:1.35}.hero h1 b{color:var(--accent)}
.hero p{margin-top:16px;color:#b9c6da;line-height:1.8}
.kpi{display:flex;gap:36px;margin-top:30px;flex-wrap:wrap}.kpi div{border-left:4px solid var(--accent);padding-left:14px;font-size:14px;color:#b9c6da}.kpi b{display:block;font-size:32px;color:#fff}
.hero .pic{background:#fff;border-radius:12px;padding:24px}.hero .pic img{width:100%;max-height:320px;object-fit:contain}
.main .wrap>*{min-width:0}
.main .wrap{display:grid;grid-template-columns:240px 1fr;gap:32px;padding-top:40px;padding-bottom:64px}
.side{background:#fff;border-radius:10px;padding:22px;align-self:start;position:sticky;top:92px}
.side h4{font-size:15px;margin-bottom:10px}
.filters{display:flex;flex-direction:column;gap:4px}
.filters button{text-align:left;padding:9px 12px;border-radius:6px;font-size:15px;color:#445}
.filters button:hover{background:#f3f5f8}.filters button.on{background:var(--accent);color:var(--navy);font-weight:700}
.side .note{margin-top:20px;font-size:13px;color:#889;line-height:1.7;border-top:1px solid #eee;padding-top:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}.head h2{font-size:22px}.head span{font-size:14px;color:#778}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e3e7ee;display:flex;flex-direction:column;transition:box-shadow .2s}
.card:hover{box-shadow:0 8px 24px rgba(19,41,75,.12)}
.card .im{background:#f7f8fa;padding:16px;cursor:pointer}.card .im img{aspect-ratio:4/3;width:100%;object-fit:contain}
.card .bd{padding:14px 18px;flex:1}.card h3{font-size:18px}
.card table{width:100%;font-size:13px;color:#556;margin-top:8px;border-collapse:collapse}.card td{padding:5px 0;border-bottom:1px dashed #e3e7ee}.card td:first-child{color:#99a;width:64px}
.card .ft{display:flex;gap:8px;padding:0 18px 18px}.card .ft button,.card .ft a{flex:1;text-align:center;font-size:14px;padding:9px;border-radius:6px;border:1px solid var(--navy);color:var(--navy);font-weight:700}
.card .ft a{background:var(--accent);border-color:var(--accent)}
.contact{background:#fff;border-top:4px solid var(--accent)}.contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-top:56px;padding-bottom:56px;align-items:center}
.contact h3{font-size:26px;color:var(--navy)}.contact p{color:#667;margin-top:10px;line-height:1.8}
.contact form{display:grid;gap:12px}.contact input,.contact textarea{font:inherit;border:1px solid #cfd6e0;border-radius:6px;padding:11px 12px}
.contact form button{background:var(--navy);color:#fff;padding:12px;border-radius:6px;font-weight:700}
footer{background:#0d1f3a;color:#8fa0bb;text-align:center;font-size:13px;padding:22px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)} .search{display:none}}
@media (max-width:760px){
 .wrap{padding:0 16px} .bar .wrap span:first-child{display:none}
 nav{display:none} .menu{display:block} header .wrap{height:60px}
 .hero .wrap{grid-template-columns:1fr;padding-top:32px;padding-bottom:36px} .hero .pic{order:-1;padding:12px} .hero .pic img{max-height:200px}
 .main .wrap{grid-template-columns:1fr;gap:16px;padding-top:20px}
 .side{position:static;padding:12px} .side h4,.side .note{display:none}
 .filters{flex-direction:row;overflow-x:auto;gap:6px} .filters button{white-space:nowrap;border:1px solid #dde;padding:7px 14px}
 .grid{grid-template-columns:1fr 1fr;gap:10px} .card .bd{padding:10px 12px} .card h3{font-size:15px} .card .ft{padding:0 10px 12px;flex-direction:column;gap:6px} .card table tr:nth-child(3){display:none}
 .contact .wrap{grid-template-columns:1fr}
}
</style></head><body>
<div class="proto">試作版：文字、數字與年齡為示意 <a href="../">回選單</a></div>
<div class="bar"><div class="wrap"><span>給幼兒園與體能老師的教具型錄</span><span>型錄 PDF　｜　聯絡我們</span></div></div>
<header><div class="wrap"><a class="logo" href="#">聰明動 <b>SMART FUN</b></a>
<nav><a href="#catalog">教具總覽</a><a href="#catalog">依能力找</a><a href="#">教案資源</a><a href="#">到園課程</a><a href="#contact">聯絡</a></nav>
<input class="search" placeholder="🔍 搜尋教具或玩法…"><span class="menu">☰</span></div></header>

<section class="hero"><div class="wrap"><div>
<h1>幼兒體能教具<br><b>與玩法整理</b></h1>
<p>每件教具整理了玩法、訓練能力、適用年齡和安全提醒，方便老師備課時查閱。</p></div>
<div class="pic"><img src="../assets/img/p13.png" alt="弧形模組"></div></div></section>

<section class="main" id="catalog"><div class="wrap">
<aside class="side"><h4>依訓練能力</h4><div class="filters" id="filters"></div>
<p class="note">之後可再加上「適用年齡」「使用場地」等篩選。</p></aside>
<div><div class="head"><h2>教具總覽</h2><span id="count"></span></div><div class="grid" id="grid"></div></div>
</div></section>

<section class="contact" id="contact"><div class="wrap">
<div><h3>詢價與合作</h3><p>想了解教具或到園課程，可以留下聯絡方式，或加 LINE 官方帳號詢問。</p></div>
<form onsubmit="alert('試作版：表單尚未連接');return false"><input placeholder="園所／單位名稱"><input placeholder="聯絡電話或 Email"><textarea rows="3" placeholder="想詢問的教具或需求"></textarea><button>送出</button></form>
</div></section>
<footer>© 聰明動 SMART FUN</footer>

<script src="../assets/plays.js"></script>
<script src="../assets/catalog.js"></script>
<script>
initCatalog({grid:"#grid",filters:"#filters",countEl:"#count",allLabel:"全部教具",card:(p,src)=>
 `<div class="card"><div class="im" data-id="${p.id}"><img src="${src}" alt="${p.name}" loading="lazy"></div>
  <div class="bd"><h3>${p.name}</h3><div class="bdgs" style="justify-content:flex-start;margin:4px 0 0">${p.badges||""}</div><table><tr><td>類別</td><td>${p.cat}</td></tr><tr><td>訓練</td><td>${p.skills.join("、")}</td></tr><tr><td>年齡</td><td>${p.age}</td></tr></table></div>
  <div class="ft"><button data-id="${p.id}">看玩法</button><a href="#contact">詢價</a></div></div>`});
</script>
</body></html>
