<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教具｜聰明動 SMART FUN</title>
<link rel="stylesheet" href="../assets/base.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@300;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--red:#d8402f;--ink:#1a1a1a;--pad:clamp(16px,6.6vw,96px)}
body{font-family:"Noto Sans TC",sans-serif;color:var(--ink);background:#fff}
.w{padding-left:var(--pad);padding-right:var(--pad);max-width:1440px;margin:0 auto}
header.top{border-bottom:1px solid #ececec;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:20}
header.top .w{display:flex;justify-content:space-between;align-items:center;height:88px}
.logo{font-size:22px;font-weight:700;letter-spacing:6px;line-height:1.1}.logo small{display:block;font-size:9px;letter-spacing:7px;color:var(--red);font-weight:400}
nav.main{display:flex;gap:44px;font-size:13px;letter-spacing:4px;color:#666}nav.main a:hover{color:#000}
.menu{display:none;font-size:22px}
.crumb{font-size:12px;letter-spacing:2px;color:#999;padding-top:28px;padding-bottom:28px;gap:10px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:80px;align-items:center;padding-bottom:88px}
.viewer{aspect-ratio:1/1;background:#eef1f3}
.vtag{position:absolute;left:24px;bottom:24px;background:#fff;font-size:11px;letter-spacing:3px;padding:8px 14px;z-index:4;pointer-events:none}
.thumbs{display:flex;gap:10px;margin-top:10px}
.th{width:88px;height:88px;padding:0;border:0;background:#f2f2f2;opacity:.7;outline-offset:3px;flex:0 0 auto}
.th img{width:100%;height:100%;object-fit:cover}.th span{font-family:"Noto Serif TC",serif;font-size:18px;letter-spacing:2px}
.th.on{opacity:1;outline:1px solid var(--ink)}
.cat{font-size:11px;letter-spacing:6px;color:var(--red)}
h1{font-family:"Noto Serif TC",serif;font-weight:300;font-size:64px;letter-spacing:8px;margin:18px 0 24px;line-height:1.2}
#desc{font-size:16px;line-height:2.1;color:#555;max-width:470px}
#facts{display:grid;grid-template-columns:110px 1fr;margin-top:40px;border-top:1px solid #e6e6e6}
#facts dt,#facts dd{padding:16px 0;border-bottom:1px solid #e6e6e6;font-size:14px}#facts dt{color:#999;letter-spacing:3px;font-size:12px;padding-top:18px}
.btns{display:flex;gap:14px;margin-top:40px}
.btns a,.btns button{padding:17px 38px;font-size:13px;letter-spacing:4px;border:1px solid var(--ink)}.btns a{background:var(--ink);color:#fff}
.modes-sec{border-top:1px solid #ececec;padding-top:72px;padding-bottom:88px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:36px}
.sh h2{font-family:"Noto Serif TC",serif;font-weight:300;font-size:30px;letter-spacing:10px}.sh span{font-size:12px;letter-spacing:3px;color:#999}
#mode-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.mg{text-align:left;padding:0;cursor:pointer}.mg img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:opacity .2s}.mg:hover img{opacity:.85}
.mg b{display:block;font-weight:500;letter-spacing:3px;margin-top:16px;font-size:15px}.mg i{font-style:normal;font-family:"Noto Serif TC",serif;color:var(--red);font-size:13px;margin-right:10px}
.mg small{display:block;font-size:12px;color:#999;margin-top:4px;letter-spacing:1px}
.mg.on b{text-decoration:underline;text-underline-offset:6px}
.plays-sec{background:#1c1c1c;color:#eee;padding-top:88px;padding-bottom:100px}
.plays-sec .sh h2{color:#fff}.plays-sec .sh span{color:#888}
.pfilters{display:flex;gap:16px 40px;align-items:center;flex-wrap:wrap;padding-bottom:32px;border-bottom:1px solid #333;margin-bottom:44px;font-size:13px}
.pfilters .g{display:flex;gap:10px;align-items:center}.pfilters .lab{color:#777;letter-spacing:3px;font-size:11px;margin-right:6px}
.chips{display:flex;gap:10px}
.chips button{border:1px solid #4a4a4a;padding:7px 18px;border-radius:30px;color:#ccc;white-space:nowrap}.chips button i{display:none}.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
#f-limit{color:#ccc;white-space:nowrap}#f-limit input{accent-color:var(--red);margin-right:4px}
.plays{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.play{background:#fff;color:var(--ink)}
.play .im{position:relative}.play .im img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.play .no{position:absolute;left:0;top:0;background:#fff;font-family:"Noto Serif TC",serif;font-size:18px;padding:10px 16px}
.play .bd{padding:26px 26px 24px}
.play h3{font-family:"Noto Serif TC",serif;font-weight:500;font-size:22px;letter-spacing:4px;display:flex;justify-content:space-between;align-items:baseline}
.play h3 small{font-family:"Noto Sans TC";font-size:12px;color:#999;letter-spacing:1px;font-weight:400;display:none}
.tags{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.t{font-size:11px;letter-spacing:2px;border:1px solid #ddd;padding:3px 10px;color:#555}.t-type{border-color:var(--ink);color:var(--ink)}.t-limit{border-color:#f0c3bd;color:#c0392b;background:#fff6f5}
.play p.in{font-size:14px;line-height:1.9;color:#666}
.play .ft{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:12px;letter-spacing:3px;color:#999;border-top:1px solid #eee;padding-top:16px}
.play .ft div{display:flex;gap:16px}.play .ft button{letter-spacing:3px;font-size:12px}.play .see{color:#555;border-bottom:1px solid #bbb}.play .more{color:var(--red)}
.detail{margin-top:18px;font-size:14px;color:#444}
.detail h4{font-size:11px;letter-spacing:3px;color:#999;font-weight:400;margin:14px 0 6px}.detail a{border-bottom:1px solid #999}
.plays-sec .empty{color:#aaa}
#plays-more{display:none}
.rel-sec{padding-top:88px;padding-bottom:96px}
#related{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.rel{background:#f6f6f6;padding:28px;text-align:center;transition:transform .2s}.rel:hover{transform:translateY(-4px)}
.rel .ri img{width:100%;aspect-ratio:1;object-fit:contain}.rel b{display:block;margin-top:14px;font-weight:400;letter-spacing:3px;font-size:14px}.rel small{display:none}
footer{border-top:1px solid #eee;text-align:center;padding:30px;font-size:11px;letter-spacing:4px;color:#aaa}
.mbar{display:none}
@media (max-width:1000px){.hero{gap:40px}h1{font-size:46px}.plays{grid-template-columns:repeat(2,1fr)}}
/* ---------- 手機版 ---------- */
@media (max-width:760px){
 body{padding-bottom:84px}
 header.top .w{height:58px}.logo{font-size:17px;letter-spacing:4px}.logo small{font-size:7px;letter-spacing:5px}
 nav.main{display:none}.menu{display:block}
 .crumb{font-size:11px;padding-top:14px;padding-bottom:14px}
 .hero{grid-template-columns:1fr;gap:0;padding-bottom:36px}
 .stage{margin:0 calc(var(--pad) * -1)}
 .vtag{left:16px;bottom:16px;font-size:10px;padding:7px 12px}
 .thumbs{overflow-x:auto;padding:10px var(--pad) 0;gap:8px;scrollbar-width:none}.th{width:64px;height:64px}
 .info{padding-top:22px}
 .cat{font-size:10px;letter-spacing:5px}
 h1{font-size:38px;letter-spacing:5px;margin:10px 0 14px}
 #desc{font-size:14px;line-height:2}
 #facts{grid-template-columns:84px 1fr;margin-top:22px}#facts dt,#facts dd{padding:12px 0;font-size:13px}#facts dt{font-size:11px;padding-top:14px}
 .btns{display:none}
 .modes-sec{padding-top:36px;padding-bottom:40px;padding-right:0}
 .sh{margin-bottom:18px}.sh h2{font-size:22px;letter-spacing:7px}.sh span{font-size:10px;letter-spacing:2px}
 .modes-sec .sh,.rel-sec .sh{padding-right:var(--pad)}
 #mode-gallery{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-right:var(--pad)}
 .mg{flex:0 0 150px}.mg img{height:200px;aspect-ratio:auto}.mg b{font-size:13px;letter-spacing:2px;margin-top:10px}.mg small{display:none}
 .plays-sec{padding-top:36px;padding-bottom:40px}
 .pfilters{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding-bottom:20px;margin-bottom:22px;scrollbar-width:none;margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad)}
 .pfilters .lab{display:none}.chips{gap:8px;flex-wrap:nowrap}.pfilters .g{flex:0 0 auto}.chips button{font-size:13px;padding:6px 15px}#f-limit{font-size:13px}
 .plays{grid-template-columns:1fr;gap:16px}
 .play .im img{aspect-ratio:auto;height:200px}.play .no{font-size:15px;padding:7px 12px}
 .play .bd{padding:18px}.play h3{font-size:19px;letter-spacing:3px}.play h3 small{display:inline}.play .ft>span{display:none}
 .tags{margin:10px 0}.t{font-size:10px;padding:2px 8px}.play p.in{font-size:13px;line-height:1.8}
 #plays-more:not([hidden]){display:block;width:100%;text-align:center;color:#ccc;font-size:12px;letter-spacing:3px;border:1px solid #444;margin-top:8px;padding:13px}
 .rel-sec{padding-top:36px;padding-bottom:30px;padding-right:0}
 #related{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-right:var(--pad)}
 .rel{flex:0 0 140px;padding:14px}.rel .ri img{height:110px;aspect-ratio:auto}.rel b{font-size:12px;letter-spacing:2px;margin-top:8px}
 .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;gap:10px;padding:12px 16px 20px;background:rgba(255,255,255,.97);border-top:1px solid #eee;z-index:30}
 .mbar a,.mbar button{flex:1;text-align:center;padding:14px 0;font-size:13px;letter-spacing:3px;border:1px solid var(--ink)}.mbar a{background:var(--ink);color:#fff;flex:1.4}
}
</style></head><body>
<div class="proto">試作版：玩法內容與 3D 尺寸為示意 <a href="../">回選單</a></div>
<header class="top"><div class="w"><a class="logo" href="index.html">聰明動<small>SMART FUN</small></a>
<nav class="main"><a href="index.html#catalog">教具系列</a><a href="#plays-sec">玩法</a><a href="index.html#about">關於我們</a><a href="index.html#contact">聯絡</a></nav><span class="menu">☰</span></div></header>

<nav class="w crumb" id="crumb"></nav>
<section class="w hero">
  <div class="stage"><div class="viewer" id="viewer"><span class="vtag">拖曳旋轉 3D ↻</span></div><div class="thumbs" id="thumbs"></div></div>
  <div class="info"><div class="cat">BALANCE ・ <span id="cat"></span></div><h1 id="name"></h1><p id="desc"></p><dl id="facts"></dl>
    <div class="btns"><a href="index.html#contact">詢問這項教具</a><button class="js-print">列印玩法</button></div></div>
</section>
<section class="w modes-sec"><div class="sh"><h2>擺 法</h2><span>點照片，上方 3D 跟著變</span></div><div id="mode-gallery"></div></section>
<section class="plays-sec" id="plays-sec"><div class="w">
  <div class="sh"><h2>玩 法</h2><span id="play-shown"></span></div>
  <div class="pfilters" id="filters"><div class="g"><span class="lab">類型</span><div class="chips" id="f-type"></div></div><div class="g"><span class="lab">年齡</span><div class="chips" id="f-age"></div></div><div class="g" id="f-limit"></div></div>
  <div class="plays" id="plays"></div><button id="plays-more"></button>
</div></section>
<section class="w rel-sec"><div class="sh"><h2>相 關 教 具</h2><span>SAME SERIES</span></div><div id="related"></div></section>
<footer>© 聰明動 SMART FUN</footer>
<div class="mbar"><button class="js-print">玩法 PDF</button><a href="index.html#contact">詢問這項教具</a></div>

<script src="../assets/catalog.js"></script>
<script src="../assets/plays.js"></script>
<script type="module">
import { initItem } from "../assets/item.js";
initItem({
  viewerBg: "#eef1f3",
  facts: ({ p, plays }) => `<dt>訓練能力</dt><dd>${p.skills.join("　")}</dd><dt>適合年齡</dt><dd>${p.age}</dd>` + (p.parts ? `<dt>零件</dt><dd>${p.parts}</dd>` : "") + `<dt>玩法</dt><dd>${plays.length ? plays.length + " 種，含排隊、雙人、團體、競賽" : "整理中"}</dd>`,
  card: c => `<article class="play"><div class="im"><img src="${c.img}" style="object-position:${c.pos}" alt="" loading="lazy"><span class="no">${c.no}</span></div>
    <div class="bd"><h3>${c.esc(c.pl.name)}</h3><div class="tags">${c.tags}</div><p class="in">${c.esc(c.pl.intro)}</p>
    <div class="ft"><span></span><div>${c.see ? `<button class="see" data-mode="${c.mode}">看擺法</button>` : ""}<button class="more">完整玩法 →</button></div></div>${c.detail}</div></article>`,
  moreLabel: "完整玩法 →",
});
</script>
</body></html>
