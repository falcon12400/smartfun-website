<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartFun 測試器材頁</title><link rel="stylesheet" href="test.css"></head><body>
<div class="testbar">測試網站 · 內容由 Firebase 測試資料庫提供，不影響正式網站</div><header class="top"><div class="wrap"><a class="brand" href="index.html"><b>聰明動</b><small>SMART FUN TEST</small></a><nav><a href="index.html">測試首頁</a><a class="admin" href="../admin/">管理資料</a></nav></div></header>
<main class="wrap item"><a class="back" href="index.html">回到測試器材列表</a><div id="content"><div class="empty">正在讀取資料庫…</div></div></main><footer>© 聰明動 SMART FUN · Firebase 測試環境</footer>
<script src="../assets/plays.js"></script><script src="../assets/catalog.js"></script><script src="../assets/firebase-config.js"></script><script src="../assets/test-data.js"></script>
<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
await SMARTFUN_TEST_READY;const id=new URLSearchParams(location.search).get('id');const p=SMARTFUN_PRODUCTS.find(x=>x.id===id);const root=document.getElementById('content');
if(!p){root.innerHTML='<div class="empty"><b>找不到這項測試器材</b><br>它可能尚未匯入資料庫，或已在後台停用。</div>';}else{document.title=`${p.name}｜SmartFun 測試網站`;const activities=SMARTFUN_PLAYS[p.id]||[];root.innerHTML=`<section class="item-hero"><div class="cover"><img src="${IMG(p,'../')}" alt="${esc(p.name)}"></div><div class="meta"><span class="cat">${esc(p.cat)}</span><h1>${esc(p.name)}</h1><p class="tagline">${esc(p.tagline)}</p><p class="desc">${esc(p.desc)}</p><div class="facts"><div class="fact"><small>適合年齡</small><b>${esc(p.age||'—')}</b></div><div class="fact"><small>零件</small><b>${esc(p.parts||'—')}</b></div></div></div></section><section class="plays"><h2>關卡玩法</h2><div class="play-grid">${activities.length?activities.map((a,i)=>{const photos=(a.photos?.length?a.photos:(a.photo?[a.photo]:[]));const photo=photos[0];return `<article class="play"><div class="play-image">${photo?`<img src="${PHOTO(photo,'../')}" alt="${esc(a.name)}">`:''}${photos.length>1?`<span class="gallery-dots">共 ${photos.length} 張</span>`:''}</div><div class="play-body"><h3>${esc(a.name)}</h3><p class="intro">${esc(a.intro)}</p><details><summary>查看完整玩法</summary>${a.steps?.length?`<h4>步驟</h4><ol>${a.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}<h4>安全提醒</h4><p>${esc(a.safety||'—')}</p><h4>簡單一點</h4><p>${esc(a.easier||'—')}</p><h4>挑戰一點</h4><p>${esc(a.harder||'—')}</p></details></div></article>`}).join(''):'<div class="empty">這項器材尚未建立關卡。</div>'}</div></section>`;}
</script></body></html>
